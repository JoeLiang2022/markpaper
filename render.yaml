# Render Blueprint for the MarkPaper on-demand PDF service.
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub/GitLab, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file.
services:
  - type: web
    name: markpaper-pdf
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    # $PORT is injected by Render; the CMD in Dockerfile.web binds to it.
    healthCheckPath: /healthz

    # LaTeX (full TeX Live) + headless Chromium (Mermaid) are memory hungry.
    # "free" (512 MB, $0) is fine for plain Markdown, but headless Chromium is
    # not: it forks renderer processes, so no per-process limit can contain it and
    # the platform OOM-kills the whole container - which callers see as a 502 with
    # their job gone. Mermaid is therefore off by default here; see ENABLE_MERMAID
    # below. Free instances also sleep after ~15 min idle.
    plan: free

    envVars:
      # Cap a single build so a pathological document cannot pin the instance.
      - key: BUILD_TIMEOUT
        value: "240"
      # Max Markdown payload accepted by POST /api/pdf (bytes).
      - key: MAX_INPUT_BYTES
        value: "2097152"
      # Simultaneous builds. Keep at 1 on small instances to avoid OOM.
      - key: MAX_CONCURRENCY
        value: "1"
      # Address-space cap per LaTeX child (MiB), as a runaway guard only. Do NOT
      # size this to the instance: `ulimit -v` bounds virtual address space, and
      # LuaTeX reserves far more of that than it uses. A value tight enough to
      # "fit" 512 MB kills every CJK build, because luaotfload has to parse the
      # ~20 MB Noto CJK collection. 0 disables the cap.
      - key: MEM_LIMIT_MB
        value: "1024"
      # Mermaid rendering launches headless Chromium, which reliably exhausts a
      # 512 MB instance and takes the whole service down (502). Off by default so
      # the service stays up; documents containing Mermaid still build, with the
      # diagram shown as a code block and a warning attached to the result.
      # Set to "true" on a plan with more memory (starter or larger).
      - key: ENABLE_MERMAID
        value: "false"
      # SECURITY: this endpoint compiles arbitrary user Markdown/LaTeX.
      # By default the service is PUBLIC so the browser UI works out of the box.
      # To lock it down, add an environment variable named API_TOKEN in the
      # Render dashboard (Environment tab) with a strong secret value. Once set,
      # POST /api/pdf requires "Authorization: Bearer <token>"; the browser UI
      # has an "API token" field to supply it.
